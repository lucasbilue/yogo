name: yogo-display
version: "1.0.0"
description: "Mirrors Hermes agent lifecycle onto the 6x6 RGB display on an ATK Yogo 75 PRO keyboard. Set YOGO_DISPLAY_DISABLE=1 to mute."
author: ross
hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - api_request_error
  - subagent_start
  - subagent_stop
  - on_session_finalize
  - on_session_end
